name: publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); this is the only publish credential

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Auth comes from the id-token permission above via npm trusted publishing.
      # There is no secret to supply, and each publish carries SLSA provenance.
      - run: pnpm --filter @orvox/schema publish --access public --no-git-checks
      - run: pnpm --filter @orvox/core publish --access public --no-git-checks
      - run: pnpm --filter @orvox/compiler publish --access public --no-git-checks
      - run: pnpm --filter @orvox/cli publish --access public --no-git-checks

